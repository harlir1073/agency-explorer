<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency Explorer</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2430;--mute:#6b7585;--line:#e2e6ec;--acc:#2563eb;--acc2:#dbe7ff;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111827;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;font-weight:600}
nav button{background:none;border:0;color:#cbd5e1;font:inherit;padding:8px 14px;cursor:pointer;border-radius:6px}
nav button.on{background:#374151;color:#fff}
main{padding:16px 20px;max-width:1700px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,button.b{font:inherit;padding:7px 9px;border:1px solid #cdd3dc;border-radius:6px;background:#fff;color:var(--ink)}
input[type=search]{width:340px}
button.b{cursor:pointer}button.b:hover{background:#f0f3f8}
.count{margin:6px 0 10px;color:var(--mute)}.count b{color:var(--ink)}
.tw{overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#eef1f6;cursor:pointer;white-space:nowrap;user-select:none;z-index:2}
th:hover{background:#e3e8f0}th .ar{color:var(--acc);margin-left:4px}
tr:hover td{background:#f7faff}
td.n{min-width:200px;font-weight:600}td.a{min-width:240px}td.p{white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--acc2);color:#1e40af;font-size:12px;cursor:pointer;white-space:nowrap}
.off{color:#b91c1c;font-size:12px}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi .v{font-size:28px;font-weight:700}.kpi .l{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 10px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;cursor:pointer;font-size:13px}
.bar:hover{background:#f0f5ff}
.bar .nm{width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:#eef1f6;border-radius:4px;height:15px}
.bar .fl{background:var(--acc);height:100%;border-radius:4px}
.bar .ct{width:90px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.small{max-height:520px;overflow:auto}
.hide{display:none}
.cb{display:flex;gap:6px;align-items:center;font-size:13px}
</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#111827;z-index:100;display:flex;align-items:center;justify-content:center">
 <form id="lf" style="background:#fff;padding:28px;border-radius:12px;width:340px;display:flex;flex-direction:column;gap:12px">
  <h2 style="margin:0;font-size:18px">Agency Explorer</h2>
  <div style="color:#6b7585;font-size:13px">Enter the password to decrypt the data. It is decrypted in your browser only.</div>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%" autofocus>
  <button class="b" id="go" style="background:#2563eb;color:#fff;border-color:#2563eb">Unlock</button>
  <div id="lmsg" style="color:#b91c1c;font-size:13px;min-height:18px"></div>
 </form>
</div><header><h1>Agency Explorer</h1>
<nav><button id="t1" class="on">Agencies</button><button id="t2">Statistics</button></nav></header>
<main>
<section id="p1">
 <div class="card">
  <div class="filters">
   <label>Search (name, address, email, phone)<input id="q" type="search" placeholder="Type to search…"></label>
   <label>Country<select id="cty"></select></label>
   <label>Status<select id="act"><option value="">All</option><option value="1">Active</option><option value="0">Inactive</option></select></label>
   <label>Has<select id="has"><option value="">Any</option><option value="email">Email</option><option value="phone">Phone</option><option value="both">Email + phone</option></select></label>
   <label>Country confidence<select id="src"><option value="">All</option><option value="h">High (email / address / prefix)</option><option value="l">Lower (city or unprefixed phone)</option></select></label>
   <button class="b" id="reset">Reset</button>
   <button class="b" id="exp">Export results (CSV)</button>
  </div>
  <div class="count" id="cnt"></div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div class="pager"><button class="b" id="pv">‹ Prev</button><span id="pg"></span><button class="b" id="nx">Next ›</button>
   <label class="cb" style="margin-left:auto">Rows per page <select id="ps"><option>50</option><option selected>100</option><option>250</option><option>500</option></select></label></div>
 </div>
</section>
<section id="p2" class="hide">
 <div class="kpis" id="kpis"></div>
 <div class="grid2">
  <div class="card"><h2>Agencies by country <span style="font-weight:400;color:var(--mute)">(click a country to see its agencies)</span></h2>
   <input id="sq" type="search" placeholder="Filter countries…" style="width:100%;margin-bottom:8px"><div class="small" id="bars" style="max-height:640px"></div></div>
  <div style="display:flex;flex-direction:column;gap:14px">
   <div class="card"><h2>Top 10 countries – share of all agencies</h2><div id="top10"></div></div>
   <div class="card"><h2>Contact data completeness</h2><div id="comp"></div></div>
   <div class="card"><h2>How the country was determined</h2><div id="srcs"></div></div>
  </div>
 </div>
</section>
</main>
<script>
const COLS=["AgencyID","Name","Country","Address","ZipCode","Phone","Fax","Email","PrimaryEmail","CountrySource","Active"];
async function boot(D){
const C=D.c, R=D.r; // R rows: [id,name,countryIdx,address,zip,phone,fax,email,pemail,srcIdx,active]
const S=D.s;
const $=id=>document.getElementById(id);
const HI=new Set(S.map((s,i)=>/email|address|phone code/.test(s)&&!/no prefix/.test(s)?i:-1).filter(i=>i>=0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString();
// precompute search text
const T=R.map(r=>(r[1]+' '+r[3]+' '+r[4]+' '+r[5]+' '+r[6]+' '+r[7]+' '+r[8]+' '+C[r[2]]).toLowerCase());
// country counts
const cc=new Array(C.length).fill(0); R.forEach(r=>cc[r[2]]++);
const ctyOrder=C.map((n,i)=>i).sort((a,b)=>cc[b]-cc[a]);
$('cty').innerHTML='<option value="">All countries ('+C.length+')</option>'+[...ctyOrder].sort((a,b)=>C[a].localeCompare(C[b])).map(i=>`<option value="${i}">${esc(C[i])} (${fmt(cc[i])})</option>`).join('');
// ---- table
const HEAD=[["Name",1],["Country",2],["Address",3],["Phone",5],["Fax",6],["Email",7],["Email 2",8],["Zip",4],["Status",10],["ID",0]];
let sortCol=1,sortDir=1,page=0,view=[];
$('th').innerHTML='<tr>'+HEAD.map((h,i)=>`<th data-i="${i}">${h[0]}<span class="ar"></span></th>`).join('')+'</tr>';
$('th').onclick=e=>{const th=e.target.closest('th');if(!th)return;const c=HEAD[th.dataset.i][1];if(sortCol===c)sortDir=-sortDir;else{sortCol=c;sortDir=1}page=0;sortView();render()};
function key(r,c){return c===2?C[r[2]]:c===0?+r[0]:c===10?+r[10]:(r[c]||'').toLowerCase()}
function sortView(){const c=sortCol,d=sortDir;view.sort((a,b)=>{const x=key(a,c),y=key(b,c);return (x<y?-1:x>y?1:0)*d});
 [...$('th').querySelectorAll('th')].forEach((th,i)=>th.querySelector('.ar').textContent=HEAD[i][1]===c?(d>0?'▲':'▼'):'')}
function filt(){
 const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),ct=$('cty').value,ac=$('act').value,hs=$('has').value,sc=$('src').value;
 view=R.filter((r,i)=>{
  if(ct!==''&&r[2]!=ct)return false;
  if(ac!==''&&r[10]!==ac)return false;
  if(hs){const e=!!(r[7]||r[8]),p=!!r[5];if(hs==='email'&&!e)return false;if(hs==='phone'&&!p)return false;if(hs==='both'&&!(e&&p))return false}
  if(sc){const h=HI.has(+r[9]);if(sc==='h'&&!h)return false;if(sc==='l'&&h)return false}
  for(const w of q)if(T[i].indexOf(w)<0)return false;return true});
 page=0;sortView();render()}
function render(){
 const ps=+$('ps').value,n=view.length,pages=Math.max(1,Math.ceil(n/ps));if(page>=pages)page=pages-1;
 const sl=view.slice(page*ps,page*ps+ps);
 $('tb').innerHTML=sl.map(r=>`<tr><td class="n">${esc(r[1])}</td><td><span class="tag" data-c="${r[2]}">${esc(C[r[2]])}</span></td><td class="a">${esc(r[3])}</td><td class="p">${esc(r[5])}</td><td class="p">${esc(r[6])}</td><td>${r[7]?`<a href="mailto:${esc(r[7].split(/[;,\s]/)[0])}">${esc(r[7])}</a>`:''}</td><td>${esc(r[8])}</td><td>${esc(r[4])}</td><td>${r[10]==='1'?'Active':'<span class="off">Inactive</span>'}</td><td>${esc(r[0])}</td></tr>`).join('');
 $('cnt').innerHTML=`Showing <b>${fmt(n)}</b> of ${fmt(R.length)} agencies`;
 $('pg').textContent=`Page ${page+1} of ${fmt(pages)}`;$('pv').disabled=page===0;$('nx').disabled=page>=pages-1}
$('tb').onclick=e=>{const t=e.target.closest('.tag');if(t){$('cty').value=t.dataset.c;filt()}};
['q'].forEach(i=>{let t;$(i).oninput=()=>{clearTimeout(t);t=setTimeout(filt,200)}});
['cty','act','has','src'].forEach(i=>$(i).onchange=filt);
$('ps').onchange=()=>{page=0;render()};
$('pv').onclick=()=>{page--;render();$('tb').parentElement.scrollTop=0};$('nx').onclick=()=>{page++;render();$('tb').parentElement.scrollTop=0};
$('reset').onclick=()=>{$('q').value='';['cty','act','has','src'].forEach(i=>$(i).value='');filt()};
$('exp').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[COLS.map(q).join(',')].concat(view.map(r=>COLS.map((c,i)=>q(i===2?C[r[2]]:i===9?S[r[9]]:r[i])).join(',')));
 const b=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agencies_filtered.csv';a.click()};
// ---- stats
function showCountry(i){$('cty').value=i;filt();tab(1)}
function barHtml(items,max,total,clickable){return items.map(([n,v,i])=>`<div class="bar" ${clickable?`data-i="${i}"`:''}><div class="nm" title="${esc(n)}">${esc(n)}</div><div class="tr"><div class="fl" style="width:${Math.max(0.5,v/max*100)}%"></div></div><div class="ct">${fmt(v)} · ${(v/total*100).toFixed(1)}%</div></div>`).join('')}
function stats(){
 const N=R.length,act=R.filter(r=>r[10]==='1').length,em=R.filter(r=>r[7]||r[8]).length,ph=R.filter(r=>r[5]).length,fx=R.filter(r=>r[6]).length,both=R.filter(r=>(r[7]||r[8])&&r[5]).length;
 const top=ctyOrder[0],avg=N/C.length;
 const k=[[fmt(N),'Total agencies'],[fmt(C.length),'Countries'],[fmt(act),`Active (${(act/N*100).toFixed(1)}%)`],[fmt(N-act),'Inactive'],[C[top],`Largest country (${fmt(cc[top])})`],[avg.toFixed(0),'Average agencies per country'],[fmt(ctyOrder.filter(i=>cc[i]<=10).length),'Countries with ≤10 agencies']];
 $('kpis').innerHTML=k.map(x=>`<div class="card kpi"><div class="v">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
 const all=ctyOrder.map(i=>[C[i],cc[i],i]);const mx=all[0][1];
 const draw=()=>{const f=$('sq').value.trim().toLowerCase();$('bars').innerHTML=barHtml(all.filter(a=>a[0].toLowerCase().includes(f)),mx,N,true)};draw();$('sq').oninput=draw;
 $('bars').onclick=e=>{const b=e.target.closest('.bar');if(b)showCountry(b.dataset.i)};
 $('top10').innerHTML=barHtml(all.slice(0,10),mx,N,true);$('top10').onclick=$('bars').onclick;
 const comp=[['Email',em],['Phone',ph],['Email + phone',both],['Fax',fx],['Address',R.filter(r=>r[3]).length],['Zip code',R.filter(r=>r[4]).length]];
 $('comp').innerHTML=barHtml(comp.map(c=>[c[0],c[1],0]),N,N,false);
 const sm={};R.forEach(r=>sm[r[9]]=(sm[r[9]]||0)+1);
 $('srcs').innerHTML=barHtml(Object.entries(sm).map(([i,v])=>[S[i],v,0]).sort((a,b)=>b[1]-a[1]),N,N,false)}
function tab(n){$('p1').classList.toggle('hide',n!==1);$('p2').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
stats();filt();}
</script><script>
(async function(){
 const msg=t=>document.getElementById('lmsg').textContent=t;
 let blob;
 try{const r=await fetch('data.enc');if(!r.ok)throw 0;blob=new Uint8Array(await r.arrayBuffer())}catch(e){msg('Could not load data.enc');return}
 document.getElementById('lf').onsubmit=async ev=>{
  ev.preventDefault();const go=document.getElementById('go');go.disabled=true;msg('Unlocking…');
  try{
   const pw=document.getElementById('pw').value;
   const salt=blob.slice(0,16),iv=blob.slice(16,32),ct=blob.slice(32,blob.length-32),mac=blob.slice(blob.length-32);
   const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
   const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,512));
   const hk=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
   const ok=await crypto.subtle.verify('HMAC',hk,mac,blob.slice(0,blob.length-32));
   if(!ok){msg('Wrong password.');go.disabled=false;return}
   const ek=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
   const gz=await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct);
   const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
   msg('Loading…');
   const D=JSON.parse(txt);
   document.getElementById('lock').remove();
   await boot(D);
  }catch(e){msg('Error: '+e.message);go.disabled=false}
 };
})();
</script></body></html>
